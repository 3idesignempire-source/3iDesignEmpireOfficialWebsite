<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3i Design Empire - Malaysia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #111111 0%, #030303 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            padding: 15px;
        }

        .splash-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 650px;
            width: 100%;
            margin: auto;
        }

        .crown-logo-graphic {
            width: 95px;
            height: 65px;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeInCrown 1.2s ease 0.2s forwards, floatCrown 3s ease-in-out infinite alternate;
            filter: drop-shadow(0 15px 25px rgba(191, 149, 63, 0.6));
        }

        @keyframes fadeInCrown {
            from { opacity: 0; transform: translateY(-20px) scale(0.3); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes floatCrown {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }

        .logo-container {
            perspective: 1200px;
            margin-bottom: 15px;
            width: 100%;
        }

        .logo-3d {
            font-family: 'Cinzel', serif;
            font-size: 3.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: perfectZoomIn 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards, floatGold 3.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 20px 30px rgba(191, 149, 63, 0.4));
            letter-spacing: 2px;
            text-align: center;
            opacity: 0;
            transform: scale(0.2) translateZ(-100px);
            line-height: 1.2;
        }

        @keyframes perfectZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.2) translateZ(-100px) rotateX(45deg);
                filter: drop-shadow(0 0 0 rgba(191, 149, 63, 0));
            }
            60% {
                opacity: 1;
                transform: scale(1.06) translateZ(20px) rotateX(-5deg);
                filter: drop-shadow(0 25px 40px rgba(191, 149, 63, 0.6));
            }
            100% {
                opacity: 1;
                transform: scale(1) translateZ(0) rotateX(0deg);
                filter: drop-shadow(0 15px 25px rgba(191, 149, 63, 0.4));
            }
        }

        @keyframes floatGold {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .splash-subtitle {
            font-size: 1rem;
            color: #d4d4d4;
            margin-bottom: 28px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0;
            animation: fadeInText 1.2s ease 1s forwards;
            text-align: center;
            background: linear-gradient(90deg, #e5e5e5, #bf953f, #e5e5e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.4;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

            background: rgba(18, 18, 18, 0.
